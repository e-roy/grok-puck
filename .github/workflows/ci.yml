# Checks on every pull request to main and every push to main. Each job is its own check, so a branch
# ruleset can require them by name: bridge, docker, firmware. Keep the job names stable.
#
# Every action is pinned to a full commit SHA from a release at least 7 days old (the same rule as the
# bridge's packages), and only GitHub's, pnpm's and Espressif's are used. Runs for pull requests get a
# read-only token and, from forks, no secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; every run on main finishes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bridge:
    name: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm version from package.json
        id: pnpm
        # devEngines asks for ^11.2.2: install exactly 11.2.2, as the Dockerfile does, so a range can't
        # pick a pnpm release younger than 7 days.
        run: |
          echo "version=$(jq -r '.devEngines.packageManager.version | sub("^[~^]"; "")' package.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bridge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:admin

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bridge image (not pushed)
        run: docker build -t grok-puck:ci bridge

  firmware:
    name: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Espressif's ESP-IDF v6.1 image (the v6.1 tag, built 2026-08-26), pinned by digest.
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for esp32s3
        # As in firmware/README.md: idf.py build, with the target set by sdkconfig.defaults. The image's
        # entrypoint, which sets up ESP-IDF, doesn't run in a job container, so export.sh does it here.
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py build
