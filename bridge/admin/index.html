<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Grok Puck</title>
    <meta name="description" content="Grok Puck's admin page: devices, bots, speech and the Grok Bot connection." />
    <meta name="robots" content="noindex" />
    <script>
      // The theme before the first paint (lib/theme.tsx takes over), so a reload doesn't flash light.
      try {
        var t = localStorage.getItem('grok-puck-theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8C62 26 88 42 88 60a38 38 0 0 1-76 0C12 42 38 26 50 8Z' fill='%23f59e0b'/%3E%3Crect x='36' y='46' width='8' height='18' rx='4' fill='%23fff'/%3E%3Crect x='56' y='46' width='8' height='18' rx='4' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
