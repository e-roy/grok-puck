# The bridge and its own Cloudflare Tunnel, for the always-on machine.
# Settings come from .env next to this file (copy .env.example). Nothing is published on the host:
# the tunnel reaches the bridge inside this compose network.
#
# The tunnel's published application routes (Cloudflare Zero Trust → Networks → Tunnels → the tunnel),
# each with this Service URL and nothing in HTTP Host Header:
#   desk.example.com        → http://bridge:8787   devices and Grok Bot (no Access application here)
#   desk-admin.example.com  → http://bridge:8788   the admin page (protected by an Access application)

# The project name, so the containers and the data volume (grok-puck_bridge_data) keep their names
# whatever the folder is called.
name: grok-puck

services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PUBLIC_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      ADMIN_AUTH: cloudflare-access
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN in .env}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bridge_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    # Pin a release in .env (CLOUDFLARED_VERSION, see .env.example) rather than following "latest".
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      bridge:
        condition: service_healthy

volumes:
  bridge_data:
